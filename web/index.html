<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTMCS — Tòa Soạn Hội Tụ</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
            text-align: center;
            padding: 20px;
        }
        .portal-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px 36px;
            max-width: 480px;
            width: 100%;
        }
        .portal-logo {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: linear-gradient(135deg, #5574ef, #2b49b9);
            color: #fff;
            font-size: 30px;
            font-weight: 900;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            box-shadow: 0 8px 20px rgba(53, 88, 212, 0.25);
        }
        h1 {
            font-size: 24px;
            margin: 0 0 8px;
            color: var(--text);
            font-weight: 800;
        }
        p {
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 24px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="portal-card">
        <div class="portal-logo">N</div>
        <h1>Tòa Soạn Hội Tụ NTMCS</h1>
        <p>Hệ thống Quản lý và Điều phối Đề tài Báo chí đa nền tảng<br><small style="color:var(--muted); font-size:12px;">(SWP391 — Nhóm 4)</small></p>
        <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px;">
            <a href="login" class="btn primary full" style="padding: 12px; font-size: 14px; font-weight: 700;">
                🔐 Đăng nhập hệ thống &rarr;
            </a>
            <a href="home" class="btn full" style="border: 1px solid var(--line); padding: 12px; font-size: 14px; font-weight: 600;">
                🏠 Vào Trang chủ NTMCS &rarr;
            </a>
        </div>
    </div>
</body>
</html>
